name: Build delivery ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create delivery ZIP
        run: |
          zip -r "蔵書レファレンスナビ.zip" . \
            -x '.git/*' '.github/*' '蔵書レファレンスナビ.zip'
      - name: Upload delivery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: library-reference-navigator-delivery
          path: 蔵書レファレンスナビ.zip
          if-no-files-found: error
          retention-days: 30
